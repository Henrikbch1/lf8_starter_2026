name: Tests

# Führt alle Unit- und Integrationstests aus. Kein docker compose nötig:
# Die Integrationstests starten ihre Postgres-DB per Testcontainers und der
# Employee-Client wird gemockt (MockRestServiceServer / @MockitoBean).

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Maven Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Code auschecken
        uses: actions/checkout@v5

      - name: JDK 26 einrichten
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '26'
          cache: maven

      - name: Maven-Abhängigkeiten herunterladen
        shell: bash
        run: |
          for attempt in 1 2 3; do
            if ./mvnw -B -U dependency:go-offline; then
              exit 0
            fi
            if [ "$attempt" -eq 3 ]; then
              echo "::error::Maven-Abhängigkeiten konnten nach 3 Versuchen nicht geladen werden."
              exit 1
            fi
            echo "::warning::Download fehlgeschlagen (Versuch $attempt/3). Neuer Versuch in 10 Sekunden."
            sleep 10
          done

      - name: Alle Tests ausführen
        run: ./mvnw -B verify

      - name: Testberichte hochladen
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: surefire-reports
          path: target/surefire-reports
          if-no-files-found: ignore
